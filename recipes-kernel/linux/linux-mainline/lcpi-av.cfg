# Kernel config fragment for the LCPI-PC-T113 A/V + display bring-up.
# Merged on top of the BSP defconfig by kernel-yocto (merge_config.sh).

# --- Capacitive touch on the LCD (GT911 on I2C2, already in the device tree) ---
CONFIG_INPUT_TOUCHSCREEN=y
CONFIG_TOUCHSCREEN_GOODIX=y
CONFIG_INPUT_EVDEV=y

# --- Framebuffer console on the panel ---
# Needed for the psplash boot splash (draws to /dev/fb0) and for the pingpong
# kiosk, which grabs a VT (/dev/tty1) in KD_GRAPHICS mode.
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y
# Disable the built-in kernel boot logo (the Tux penguins, one per CPU). We show
# a branded psplash splash (company logo + progress bar) from early userspace
# instead; the penguins would otherwise flash briefly before it appears.
# CONFIG_LOGO is not set

# --- PWM backlight for the panel, built in for a deterministic boot ---
CONFIG_PWM=y
CONFIG_PWM_SUN4I=y
CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_BACKLIGHT_PWM=y

# --- zram swap to stretch the fixed 128MB of DDR3 ---
CONFIG_SWAP=y
CONFIG_ZRAM=y
CONFIG_ZSMALLOC=y
# meta-oe's zram-swap-init calls "zramctl -a lz4" by default, so the kernel MUST
# provide the lz4 compressor or the zram-swap.service fails at boot. Ship lzo +
# zstd too so alternate algorithms in /etc/default/zram also work.
CONFIG_CRYPTO_LZ4=y
CONFIG_CRYPTO_LZ4HC=y
CONFIG_CRYPTO_LZO=y
CONFIG_CRYPTO_ZSTD=y
