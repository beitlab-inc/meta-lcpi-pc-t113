#@TYPE: Distribution
#@NAME: BeitlabOS
#@DESCRIPTION: Beitlab embedded Linux distribution for LCPI-PC-T113 class boards

# BeitlabOS is a thin corporate skin over the Poky reference distro: identical
# policy, QA rules, security flags and DISTRO_FEATURES, different identity.
# Everything a user or a customer ever sees - the serial login banner
# (/etc/issue), the MOTD, /etc/os-release and the SDK paths - is driven by the
# variables in this file.
require conf/distro/poky.conf

# The Yocto release we are built on, captured BEFORE we overwrite DISTRO_*.
# ":=" (immediate expansion) is mandatory here: a lazy "=" would be expanded
# later and would just echo back our own BeitlabOS values.
BEITLAB_YOCTO_CODENAME := "${DISTRO_CODENAME}"
BEITLAB_YOCTO_VERSION := "${DISTRO_VERSION}"

# --- Internal Beitlab release identity ---------------------------------------
# BEITLAB_VERSION is the product version, BEITLAB_BUILD the internal build
# number: bump BEITLAB_BUILD for every image that leaves the lab, and
# BEITLAB_VERSION for a real release. Both feed the banner, the MOTD and
# /etc/os-release, so a board can always be traced back to a build.
# Override either in local.conf (e.g. from CI: BEITLAB_BUILD = "0042").
BEITLAB_VERSION ?= "1.0.0"
BEITLAB_BUILD ?= "0001"
BEITLAB_RELEASE ?= "${BEITLAB_VERSION}-${BEITLAB_BUILD}"

BEITLAB_VENDOR ?= "BEITLAB"
BEITLAB_PRODUCT ?= "Beitlab Embedded Platform"

# Human-readable board name shown on the banner. The machine conf overrides
# this with the marketing name; anything else falls back to the MACHINE.
BEITLAB_BOARD ?= "${MACHINE}"

# Left empty on purpose - fill in with the real corporate URL / support mailbox
# and they will appear in /etc/os-release, the MOTD and the network banner.
BEITLAB_URL ?= ""
BEITLAB_SUPPORT ?= ""

# --- Distro identity ---------------------------------------------------------
# poky.conf hard-assigns DISTRO = "poky", so these must come AFTER the require
# above, otherwise DISTROOVERRIDES and os-release's ID would still say "poky".
DISTRO = "beitlabos"
DISTRO_NAME = "BeitlabOS"
DISTRO_VERSION = "${BEITLAB_RELEASE}"
DISTRO_CODENAME = "${BEITLAB_YOCTO_CODENAME}"
MAINTAINER = "${BEITLAB_VENDOR}"

SDK_VENDOR = "-beitlabsdk"
SDK_NAME = "${DISTRO}-${TCLIBC}-${SDKMACHINE}-${IMAGE_BASENAME}-${TUNE_PKGARCH}-${MACHINE}"
SDKPATHINSTALL = "/opt/${DISTRO}/${SDK_VERSION}"

# TARGET_VENDOR is deliberately left at poky.conf's "-poky". It is baked into
# the cross-toolchain triplet (arm-poky-linux-gnueabi), so changing it
# invalidates every sstate object and forces a full from-scratch rebuild - for a
# string that only ever shows up in build-internal paths. Uncomment if the
# triplet itself must be branded, and budget a multi-hour rebuild.
#TARGET_VENDOR = "-beitlab"
