#@TYPE: Machine
#@NAME: lcpi-pc-t113 (T113-S3)
#@DESCRIPTION: Reference machine configuration for https://linux-sunxi.org/LCPI-PC-T113/F113 board

require conf/machine/include/tune-cortexa7.inc
SOC_FAMILY = "sun8i"
MACHINEOVERRIDES =. "sun8i"

PREFERRED_PROVIDER_virtual/kernel ?= "linux-mainline"
PREFERRED_PROVIDER_virtual/bootloader = "awboot"
EXTRA_IMAGEDEPENDS += "awboot"

KERNEL_IMAGETYPE = "zImage"
KERNEL_DEVICETREE_FILE = "sun8i-t113-mangopi-dual.dtb"
KERNEL_DEVICETREE = "allwinner/${KERNEL_DEVICETREE_FILE}"
IMAGE_BOOT_FILES ?= "\
    ${KERNEL_IMAGETYPE} \
    ${KERNEL_DEVICETREE_FILE} \
    "

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS = " kernel-modules"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = "kernel-image kernel-devicetree"

IMAGE_FSTYPES += "tar.bz2 ext4 wic wic.bmap"

WKS_FILE ?= "lcpi-pc-t113.wks"
WKS_FILE_DEPENDS ?= " \
    mtools-native \
    dosfstools-native \
    virtual/bootloader \
    virtual/kernel \
    "

SERIAL_CONSOLE ?= "115200;ttyS0"
MACHINE_FEATURES ?= "alsa apm keyboard rtc serial screen vfat"

# Board name as printed on the BeitlabOS login banner / MOTD, and the system
# hostname (the "<host> login:" prompt, /etc/hostname, /etc/hosts and the USB
# gadget product string). See conf/distro/beitlabos.conf; both are harmless when
# building with another distro.
BEITLAB_BOARD ?= "LCPI-PC-T113 (Allwinner T113-S3)"
BEITLAB_HOSTNAME ?= "beitlab-t113"
DISTRO_FEATURES_remove = "pci 3g nfc ptest multiarch wayland vulkan bluetooth"
