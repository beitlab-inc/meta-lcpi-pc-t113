# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-lcpi-pc-t113"
BBFILE_PATTERN_meta-lcpi-pc-t113  = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-lcpi-pc-t113 = "5"

LAYERDEPENDS_meta-lcpi-pc-t113 = "core"
LAYERSERIES_COMPAT_meta-lcpi-pc-t113 = "dunfell"
